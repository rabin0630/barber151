<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>barber151 - 管理者画面</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    /* 管理画面特有のスタイル */
    .booked-cell {
      background-color: #dbeafe; /* 薄い青色で予約が入っていることを強調 */
      color: #1e40af;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px;
      line-height: 1.3;
    }

    /* メニュー管理 */
    .menu-admin-category {
      margin-bottom: 1.5rem;
    }
    .menu-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .menu-row-new {
      background: #f9fafb;
      border-style: dashed;
    }
    .menu-row input,
    .menu-row select {
      width: auto;
      min-height: 40px;
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 16px;
      font-family: inherit;
      box-sizing: border-box;
    }
    .menu-row .menu-row-name {
      flex: 1 1 180px;
      min-width: 0;
    }
    .menu-row-field {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.9rem;
    }
    .menu-row-field input {
      width: 6.5rem;
    }
    .menu-row-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }
    .menu-row-actions button {
      min-height: 40px;
      padding: 0.5rem 1rem;
      border: 1px solid;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .menu-row-actions button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .menu-save-btn {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .menu-delete-btn {
      background: #ffffff;
      border-color: #fca5a5;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="index.html">
      <h1>barber151</h1>
    </a>
    <nav class="header-nav">
      <a href="booking.html" class="nav-link">予約画面</a>
      <a href="admin.html" class="nav-link active">管理者画面</a>
    </nav>
  </header>

  <main class="main-body">
    <div class="reservation-container" style="max-width: 900px;">
      <h2>予約一覧（管理者用）</h2>
      <div class="reservation-wrapper">
        <div id="control-wrapper" class="control-wrapper">
          <div class="schedule-nav">
            <button type="button" class="nav-btn prev-schedule-btn">←</button>
            <input type="date" id="date-jump" class="date-jump-input">
            <button type="button" class="nav-btn next-schedule-btn">→</button>
          </div>
        </div>
        <div id="schedule-wrapper" class="schedule-wrapper">
          <table id="schedule-table">
            <thead>
              <tr id="schedule-header-month"></tr>
              <tr id="schedule-header">
              </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
          </table>
        </div>
      </div>

      <!-- 履歴表示エリア -->
      <div id="history-wrapper" style="margin-top: 2.5rem;">
        <h3 style="margin-bottom: 1rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem; color: #111827;">最近の予約追加履歴</h3>
        <ul id="history-list" style="list-style: none; padding: 0; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
          <li style="padding: 1rem; text-align: center; color: #6b7280;">読み込み中...</li>
        </ul>
      </div>

      <!-- メニュー管理エリア -->
      <div id="menu-manager-wrapper" style="margin-top: 2.5rem;">
        <h3 style="margin-bottom: 1rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem; color: #111827;">メニュー管理</h3>
        <p style="font-size: 0.85rem; color: #6b7280; margin-top: 0;">名前・料金・所要時間を入力して「追加」「保存」を押すと、予約画面に反映されます。</p>
        <div id="menu-status-message" class="status-message" role="alert" style="display: none;"></div>
        <div id="menu-manager">
          <p style="text-align: center; color: #6b7280;">読み込み中...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 電話予約追加用モーダル -->
  <div id="admin-reservation-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 style="text-align: center; margin-top: 0;">電話予約を追加</h2>
      <p id="modal-datetime-display" style="text-align: center; font-weight: bold; margin-bottom: 1rem; color: #2563eb;"></p>
      
      <div id="admin-status-message" class="status-message" role="alert" style="display: none; margin-bottom: 1rem;"></div>

      <form id="admin-reservation-form">
        <input type="hidden" id="admin-selected-datetime">
        
        <div class="form-group">
          <label for="admin-customer-name">お名前</label>
          <input type="text" id="admin-customer-name" required placeholder="例: 山田 太郎">
        </div>

        <div class="form-group">
          <label for="admin-customer-instagram">Instagram ID（どちらか必須）</label>
          <input type="text" id="admin-customer-instagram" placeholder="例: @barber151">
        </div>

        <div class="form-group">
          <label for="admin-customer-phone">電話番号（どちらか必須）</label>
          <input type="tel" id="admin-customer-phone" placeholder="例: 090-1234-5678" maxlength="13">
          <p class="field-error">電話番号は11桁で入力してください（例: 090-1234-5678）</p>
        </div>

        <div class="form-group">
          <label for="admin-menu-select">メニュー</label>
          <select id="admin-menu-select" required>
            <option value="">選択してください</option>
          </select>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" id="modal-cancel-btn" class="nav-btn" style="flex: 1;">キャンセル</button>
          <button type="submit" id="admin-submit-btn" class="submit-btn" style="flex: 1; margin: 0;">追加する</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2024 barber151</p>
  </footer>

  <script type="module" src="/src/admin.ts"></script>
</body>
</html>
