services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # ソースとSQLiteのDBファイル（barber151.db）をホストと共有する
      - ./backend:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # ブラウザから見たAPIのURL
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      # コンテナ内のnode_modulesをホスト側で上書きしないようにする
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
